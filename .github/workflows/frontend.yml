name: Frontend Tests
on:
  workflow_call:


jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache : 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies 
        run: |
          cd frontend
          npm ci
      
      - name: Run tests
        run: |
          cd frontend
          npm test -- --run

      - name: Build
        run: |
          cd frontend 
          npm run build


